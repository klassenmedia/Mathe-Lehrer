<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahlenwerkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: Rechenheft-Kästchenpapier (hell) bzw. Schultafel (dunkel); eine Spalte, Aufgabe oben, Tastenfeld darunter. */
:root{
  --paper:#f6f8fc; --grid:#dfe7f3; --ink:#1c2f5e; --ink-soft:#56658a;
  --card:#ffffff; --line:#c8d3e6;
  --blue:#2f6fde; --blue-bg:#e4edfd; --orange:#e9761a; --orange-bg:#fdeedd;
  --marker:#ffe36e; --good:#1f8a4f; --good-bg:#e1f4e8; --bad:#cf3434; --bad-bg:#fde6e6;
  --display:"Grandstander","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b2824; --grid:#23332e; --ink:#eef3ec; --ink-soft:#a7b8ad;
  --card:#22332d; --line:#3a4f46;
  --blue:#86b6ff; --blue-bg:#263d55; --orange:#ffb46e; --orange-bg:#4a3522;
  --marker:#6d5c12; --good:#72d69e; --good-bg:#1f4231; --bad:#ff8f86; --bad-bg:#4b2523;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1b2824; --grid:#23332e; --ink:#eef3ec; --ink-soft:#a7b8ad;
  --card:#22332d; --line:#3a4f46;
  --blue:#86b6ff; --blue-bg:#263d55; --orange:#ffb46e; --orange-bg:#4a3522;
  --marker:#6d5c12; --good:#72d69e; --good-bg:#1f4231; --bad:#ff8f86; --bad-bg:#4b2523;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:var(--body); font-size:18px; line-height:1.5; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  min-height:100vh;
}
.wrap{max-width:860px; margin:0 auto; padding-inline:16px; padding-block:16px 48px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.15}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.slot:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

/* Kopf */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:20px}
.logo{display:flex; align-items:baseline; gap:10px}
.logo h1{font-size:clamp(28px,6vw,40px); font-weight:800}
.logo h1 span{background:linear-gradient(transparent 55%,var(--marker) 55%); padding-inline:2px}
.stars{font-family:var(--display); font-weight:800; font-size:20px; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:4px 14px; font-variant-numeric:tabular-nums}
.stars b{color:var(--orange)}

/* Startseite */
.intro{max-width:60ch; color:var(--ink-soft); margin:0 0 20px}
.stations{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
.station{
  text-align:left; background:var(--card); border:2px solid var(--line); border-radius:var(--r);
  padding:16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:start;
  transition:transform .12s, border-color .12s;
}
.station:hover{transform:translateY(-2px); border-color:var(--blue)}
.station .sym{grid-row:span 2; font-family:var(--display); font-weight:800; font-size:30px; width:52px; height:52px; border-radius:12px; display:grid; place-items:center; background:var(--blue-bg); color:var(--blue)}
.station:nth-child(even) .sym{background:var(--orange-bg); color:var(--orange)}
.station h3{font-size:21px}
.station p{margin:0; color:var(--ink-soft); font-size:16px}

/* Stationsstart */
.panel{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:20px}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.chip{border:2px solid var(--line); background:var(--paper); border-radius:999px; padding:4px 14px; font-weight:700; min-width:48px}
.chip[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:var(--card)}
.btn{border:none; border-radius:12px; padding:12px 20px; font-weight:700; font-size:18px; background:var(--blue); color:var(--card)}
.btn.alt{background:var(--paper); color:var(--ink); border:2px solid var(--line)}
.btn.warm{background:var(--orange); color:var(--card)}
.btn:disabled{opacity:.45; cursor:default}
.back{background:none; border:none; color:var(--ink-soft); font-weight:700; padding:4px 0}
.label{font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
.rule{border-left:6px solid var(--marker); background:var(--paper); padding:10px 14px; border-radius:0 10px 10px 0; font-weight:700}

/* Spiel */
.playhead{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.dots{display:flex; gap:6px}
.dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--card)}
.dots i.ok{background:var(--good); border-color:var(--good)}
.dots i.help{background:var(--orange); border-color:var(--orange)}
.dots i.now{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg)}
.task{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:16px}
.question{font-family:var(--display); font-weight:800; font-size:clamp(28px,7vw,46px); line-height:1.2; text-align:center; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.question.small{font-size:clamp(20px,4.6vw,28px); font-family:var(--body); font-weight:700}
.slots{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.slotbox{display:flex; flex-direction:column; align-items:center; gap:4px}
.slotbox small{font-size:14px; color:var(--ink-soft); font-weight:700; text-align:center}
.slot{
  min-width:96px; height:64px; padding-inline:10px; border:3px solid var(--line); border-radius:12px; background:var(--paper);
  font-family:var(--display); font-weight:800; font-size:34px; display:grid; place-items:center; font-variant-numeric:tabular-nums;
}
.slot.active{border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-bg)}
.slot.right{border-color:var(--good); background:var(--good-bg)}
.slot.wrong{border-color:var(--bad); background:var(--bad-bg)}
.feedback{min-height:28px; text-align:center; font-weight:700}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:340px; width:100%; margin:0 auto}
.keypad button{height:56px; border-radius:12px; border:2px solid var(--line); background:var(--paper); font-family:var(--display); font-weight:800; font-size:26px}
.keypad button:active{transform:scale(.96)}
.actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

/* Erklär-Fenster */
.sheet-bg{position:fixed; inset:0; background:rgba(10,20,40,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10; padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card); color:var(--ink); border-radius:18px; width:100%; max-width:760px; max-height:92%; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:14px; border:2px solid var(--line)}
.sheet .stepno{font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
.sheet .text{font-size:20px; max-width:62ch}
.sheet .text b{color:var(--blue)}
.visual{display:flex; flex-direction:column; align-items:center; gap:10px; min-height:40px; overflow-x:auto; padding-block:6px}
.mk{background:var(--marker); border-radius:6px; padding:0 4px}
.b{color:var(--blue); font-weight:700} .o{color:var(--orange); font-weight:700} .g{color:var(--good); font-weight:700} .r{color:var(--bad); font-weight:700}

/* Punktefeld */
.field{display:flex; flex-direction:column; gap:4px}
.field .fr{display:flex; gap:4px; align-items:center; position:relative}
.field .fr.gap{margin-top:6px}
.field .d{width:var(--dot,20px); height:var(--dot,20px); border-radius:50%; background:var(--blue)}
.field .d.o{background:var(--orange)}
.field .d.x{background:var(--line)}
.field .fr.cross::after{content:""; position:absolute; left:-4px; right:-4px; top:50%; height:3px; background:var(--bad); border-radius:2px}
.field .d.gapc{margin-left:6px}
.field .lab{font-size:14px; color:var(--ink-soft); margin-left:8px; white-space:nowrap; font-variant-numeric:tabular-nums}

/* Zahlenreihe */
.series{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.series span{border:2px solid var(--line); border-radius:10px; padding:2px 10px; font-weight:700; font-variant-numeric:tabular-nums; background:var(--paper)}
.series span.hit{background:var(--good-bg); border-color:var(--good); color:var(--good)}
.series span.over{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); text-decoration:line-through}
.series span.dim{opacity:.45}

/* Teller */
.plates{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.plate{width:92px; min-height:92px; border-radius:50%; border:3px solid var(--line); background:var(--paper); display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:3px; padding:10px; position:relative}
.plate .n{position:absolute; bottom:-12px; left:50%; transform:translateX(-50%); background:var(--card); border:2px solid var(--line); border-radius:999px; padding:0 8px; font-size:14px; font-weight:700}
.cookie{width:14px; height:14px; border-radius:50%; background:var(--orange); display:inline-block}
.pile{display:flex; flex-wrap:wrap; gap:3px; max-width:320px; justify-content:center}
.restbox{border:3px dashed var(--bad); border-radius:12px; padding:8px 12px; display:flex; gap:4px; align-items:center; min-height:40px}
.restbox b{color:var(--bad); margin-right:6px}

/* Zehner und Einer */
.base10{display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; justify-content:center}
.bar{width:14px; height:100px; border-radius:3px; background:var(--blue); position:relative; background-image:linear-gradient(var(--card) 1px,transparent 1px); background-size:100% 10px}
.cube{width:14px; height:14px; border-radius:3px; background:var(--orange)}
.cubes{display:grid; grid-template-columns:repeat(5,14px); gap:3px; margin-left:8px}
.gone{opacity:.25; position:relative}
.gone::after{content:""; position:absolute; left:-3px; right:-3px; top:50%; height:3px; background:var(--bad); transform:rotate(-35deg)}
.bar.gone::after{transform:rotate(-70deg)}

/* Begriffe-Tafel */
.eq{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; justify-content:center}
.eq .cell{display:flex; flex-direction:column; align-items:center; gap:4px}
.eq .v{font-family:var(--display); font-weight:800; font-size:34px; min-width:56px; text-align:center; border-radius:10px; padding:0 8px}
.eq .v.q{background:var(--marker)}
.eq .l{font-size:14px; font-weight:700; color:var(--ink-soft)}
.eq .op{font-family:var(--display); font-weight:800; font-size:34px}

.summary{text-align:center}
.summary .big{font-family:var(--display); font-weight:800; font-size:56px}
.redo{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.redo span{background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:2px 10px; font-weight:700}

@media (max-width:520px){
  body{font-size:17px}
  .slot{min-width:84px; height:58px; font-size:30px}
  .sheet .text{font-size:18px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><h1>Zahlen<span>werkstatt</span></h1></div>
    <div class="stars" aria-live="polite">★ <b id="starCount">0</b> Sterne</div>
  </header>
  <main id="app"></main>
</div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

/* ---------- Sterne (nur in diesem Browser gespeichert) ---------- */
let stars = 0;
try { stars = parseInt(localStorage.getItem("zw-stars") || "0", 10) || 0; } catch(e) {}
function addStar(n=1){
  stars += n; $("#starCount").textContent = stars;
  try { localStorage.setItem("zw-stars", String(stars)); } catch(e) {}
}
$("#starCount").textContent = stars;

/* ---------- Bausteine für Bilder ---------- */
// Punktefeld: rows Reihen mit je cols Punkten. rowClass(r) -> "", "o", "x"; cross(r) -> durchgestrichen
function dotField(rows, cols, {rowClass=()=> "", colClass=null, cross=()=>false, label=null}={}){
  const dot = Math.max(12, Math.min(22, Math.floor(260/cols)));
  const f = h("div",{class:"field", style:`--dot:${dot}px`});
  for (let r=0; r<rows; r++){
    const row = h("div",{class:"fr" + (r===5 ? " gap":"") + (cross(r) ? " cross":"")});
    for (let c=0; c<cols; c++){
      const cls = colClass ? colClass(c) : rowClass(r);
      row.append(h("i",{class:"d " + cls + (c===5 ? " gapc":"")}));
    }
    if (label) row.append(h("span",{class:"lab"}, label(r)));
    f.append(row);
  }
  return f;
}
function series(step, count, {hit=-1, over=-1, upto=null}={}){
  const s = h("div",{class:"series"});
  for (let i=1; i<=count; i++){
    let cls = "";
    if (i === hit) cls = "hit"; else if (i === over) cls = "over"; else if (upto && i > upto) cls = "dim";
    s.append(h("span",{class:cls}, `${i}·${step}=${i*step}`));
  }
  return s;
}
function base10(tens, ones, {goneTens=0, goneOnes=0}={}){
  const w = h("div",{class:"base10"});
  for (let i=0; i<tens; i++) w.append(h("div",{class:"bar" + (i >= tens-goneTens ? " gone":"")}));
  if (ones > 0){
    const c = h("div",{class:"cubes"});
    for (let i=0; i<ones; i++) c.append(h("div",{class:"cube" + (i >= ones-goneOnes ? " gone":"")}));
    w.append(c);
  }
  return w;
}
function eqBoard(cells){ // cells: [{v, l, q}] oder {op}
  const e = h("div",{class:"eq"});
  for (const c of cells){
    if (c.op) e.append(h("div",{class:"op"}, c.op));
    else e.append(h("div",{class:"cell"}, h("div",{class:"v" + (c.q ? " q":"")}, String(c.v)), h("div",{class:"l"}, c.l || "")));
  }
  return e;
}
function ruleBox(html){ return h("div",{class:"rule", html}); }

/* ---------- Stationen ---------- */
const STATIONS = {

  /* ===== Malreihen ===== */
  mal: {
    sym: "·", name: "Malreihen", desc: "3er, 6er und alle anderen Reihen. Mit Punktefeld und Rechentricks.",
    options: {label:"Welche Reihen üben?", values:[2,3,4,5,6,7,8,9,10], def:[3,6]},
    make(sel){
      const b = pick(sel.length ? sel : [3,6]);
      const a = rnd(1,10);
      if (Math.random() < 0.3){
        return { kind:"mal-umkehr", a, b, q:`☐ · ${b} = ${a*b}`, slots:[{label:"Zahl im Kästchen", ans:a}] };
      }
      return { kind:"mal", a, b, q:`${a} · ${b} = ?`, slots:[{label:"Ergebnis", ans:a*b}] };
    },
    hint(t, vals){
      const v = vals[0];
      if (t.kind === "mal" && (v === t.a*t.b + t.b || v === t.a*t.b - t.b)) return "Knapp! Du bist genau eine Reihe daneben. Zähl nochmal nach.";
      return null;
    },
    steps(t){
      const {a, b} = t, p = a*b;
      if (t.kind === "mal-umkehr"){
        return [
          { text:`Gesucht ist: <b>Wie oft</b> passt die ${b} in die ${p}?<br>Wir gehen die <b>${b}er-Reihe</b> entlang, bis wir bei ${p} sind.`,
            vis:() => series(b, 10, {upto:0}) },
          { text:`Wir zählen: ${Array.from({length:a},(_,i)=>(i+1)*b).join(", ")} … <span class="g">da ist die ${p}!</span>`,
            vis:() => series(b, 10, {hit:a, upto:a}) },
          { text:`Das war der <b>${a}.</b> Schritt. Also: <span class="mk">${a} · ${b} = ${p}</span>`,
            vis:() => dotField(a, b, {label:r=>`${(r+1)*b}`}) },
        ];
      }
      const steps = [{
        text:`<b>${a} · ${b}</b> heißt: ${a}-mal die ${b}.<br>Das sind <b>${a} Reihen</b> mit je <b>${b} Punkten</b>.`,
        vis:() => dotField(a, b)
      }];
      // Kernaufgaben-Trick
      const plan = {
        3:{k:2, sign:+1}, 4:{k:2, sign:"dbl"}, 6:{k:5, sign:+1}, 7:{k:5, sign:+1}, 8:{k:10, sign:-1}, 9:{k:10, sign:-1}
      }[a];
      if (!plan){
        const tip = {1:`1-mal die ${b} ist einfach ${b}.`, 2:`2-mal heißt <b>verdoppeln</b>: ${b} + ${b} = ${2*b}.`,
                     5:`5-mal ist die <b>Hälfte von 10-mal</b>: 10 · ${b} = ${10*b}, die Hälfte ist ${5*b}.`,
                     10:`10-mal: hänge an die ${b} eine <b>Null</b> an → ${10*b}.`}[a];
        steps.push({ text:`Das ist eine <b>Kernaufgabe</b>. Die kann man sich leicht merken:<br>${tip}`, vis:() => dotField(a, b, {rowClass:()=>"o"}) });
      } else if (plan.sign === "dbl"){
        steps.push({ text:`Trick: <b>4-mal ist das Doppelte von 2-mal.</b><br><span class="b">2 · ${b} = ${2*b}</span> und nochmal <span class="o">2 · ${b} = ${2*b}</span>.`,
          vis:() => dotField(4, b, {rowClass:r => r<2 ? "" : "o"}) });
        steps.push({ text:`${2*b} + ${2*b} = <span class="mk">${p}</span>`, vis:() => dotField(4, b, {rowClass:r => r<2 ? "" : "o", label:r => r===3 ? `= ${p}`:""}) });
      } else if (plan.sign > 0){
        const rest = a - plan.k;
        steps.push({ text:`Trick: Fang bei der leichten <b>Kernaufgabe</b> an.<br><span class="b">${plan.k} · ${b} = ${plan.k*b}</span> (blau). Dann kommen noch <span class="o">${rest} · ${b} = ${rest*b}</span> dazu (orange).`,
          vis:() => dotField(a, b, {rowClass:r => r<plan.k ? "" : "o"}) });
        steps.push({ text:`Zusammen: <span class="b">${plan.k*b}</span> + <span class="o">${rest*b}</span> = <span class="mk">${p}</span>`,
          vis:() => dotField(a, b, {rowClass:r => r<plan.k ? "" : "o", label:r => r===a-1 ? `= ${p}`:""}) });
      } else {
        const minus = plan.k - a;
        steps.push({ text:`Trick: Fang bei <b>10 · ${b} = ${10*b}</b> an. Das ist leicht.<br>Das sind aber ${minus} Reihe${minus>1?"n":""} zu viel. Die streichen wir weg.`,
          vis:() => dotField(10, b, {rowClass:r => r<a ? "" : "x", cross:r => r>=a}) });
        steps.push({ text:`${10*b} − <span class="r">${minus*b}</span> = <span class="mk">${p}</span>`,
          vis:() => dotField(a, b, {label:r => r===a-1 ? `= ${p}`:""}) });
      }
      if (b === 6 && a > 1){
        steps.push({ text:`Noch ein Trick für die 6er-Reihe: <b>6 ist das Doppelte von 3.</b><br>Also ist <span class="b">${a} · 3 = ${3*a}</span>, und das Doppelte davon ist <span class="mk">${p}</span>.`,
          vis:() => dotField(a, 6, {colClass:c => c<3 ? "" : "o"}) });
      }
      if (b === 3 && a > 1 && a !== 10){
        steps.push({ text:`Andersrum geht's auch: <b>3er = Hälfte der 6er.</b><br>${a} · 6 = ${6*a}, die Hälfte davon ist <span class="mk">${p}</span>.`,
          vis:() => dotField(a, 3) });
      }
      return steps;
    },
    example: { kind:"mal", a:9, b:6, q:"9 · 6 = ?", slots:[{label:"Ergebnis", ans:54}] }
  },

  /* ===== Teilen mit Rest ===== */
  teilen: {
    sym: ":", name: "Teilen mit Rest", desc: "Kekse gerecht verteilen. Was übrig bleibt, ist der Rest.",
    options: {label:"Durch welche Zahlen teilen?", values:[2,3,4,5,6,7,8,9], def:[3,4,5,6,8]},
    make(sel){
      const d = pick(sel.length ? sel : [3,4,5]);
      const q = rnd(1, 9), r = Math.random() < 0.2 ? 0 : rnd(1, d-1);
      const n = q*d + r;
      return { kind:"teilen", n, d, q:`${n} : ${d} = ?`, slots:[{label:"Ergebnis", ans:q},{label:"Rest", ans:r}] };
    },
    hint(t, vals){
      const [q, r] = vals, {n, d} = t;
      if (r >= d) return `Der Rest ist zu groß! Der Rest muss <b>kleiner als ${d}</b> sein. Wenn ${r} übrig sind, bekommt jeder noch einen.`;
      if (q*d > n) return `${q} · ${d} = ${q*d}. Das ist mehr als ${n}. So viele Kekse haben wir gar nicht!`;
      if (q*d + r !== n) return `Mach die Probe: ${q} · ${d} + ${r} = ${q*d+r}. Es müssen aber ${n} herauskommen.`;
      return null;
    },
    steps(t){
      const {n, d} = t, q = Math.floor(n/d), r = n % d;
      return [
        { text:`<b>${n} : ${d}</b> heißt: Verteile <b>${n} Kekse</b> gerecht auf <b>${d} Teller</b>.`,
          vis:() => { const p = h("div",{class:"pile"}); for (let i=0;i<n;i++) p.append(h("i",{class:"cookie"})); return p; } },
        { text:`Wir verteilen Runde für Runde: Jeder Teller bekommt einen Keks, dann wieder einen … bis es nicht mehr für alle reicht.`,
          vis:(stage) => dealVisual(n, d, stage) },
        { text:`Jeder bekommt <b>${q}</b>. Übrig bleiben <span class="r">${r}</span>. ${r===0 ? "Es geht genau auf!" : "Für eine neue Runde reicht das nicht."}`,
          vis:() => dealVisual(n, d, null, true) },
        { text:`Schneller geht's mit der <b>${d}er-Reihe</b>: Suche die größte Zahl, die <b>nicht größer als ${n}</b> ist.`,
          vis:() => series(d, Math.min(10, q+2), {hit:q, over:q+1}) },
        { text:`${q} · ${d} = ${q*d}. Bis ${n} fehlen noch ${n} − ${q*d} = <span class="r">${r}</span>. Das ist der Rest.<br><span class="mk">${n} : ${d} = ${q} Rest ${r}</span>`,
          vis:() => ruleBox(`Merke: Der Rest ist immer <u>kleiner</u> als ${d}.<br>Sonst passt noch ein ${d}er hinein!`) },
        { text:`<b>Probe:</b> Wir rechnen rückwärts: ${q} · ${d} + ${r} = ${q*d} + ${r} = <span class="g">${n} ✔</span>`,
          vis:() => null },
      ];
    },
    example: { kind:"teilen", n:29, d:5, q:"29 : 5 = ?", slots:[{label:"Ergebnis", ans:5},{label:"Rest", ans:4}] }
  },

  /* ===== Minus mit Rechenweg ===== */
  minus: {
    sym: "−", name: "Minus-Rechenwege", desc: "Erst die Zehner, dann die Einer. Mit Zehnerstangen.",
    make(){
      const a = rnd(2, 10) * 10;
      let b;
      do { b = rnd(3, a-1); } while (b % 10 === 0);
      return { kind:"minus", a, b, q:`${a} − ${b} = ?`, slots:[{label:"Ergebnis", ans:a-b}] };
    },
    hint(t, vals){
      const v = vals[0], {a, b} = t, T = Math.floor(b/10)*10, E = b%10;
      if (v === a - T + E) return `Achtung: Die ${E} Einer musst du auch <b>abziehen</b>, nicht dazuzählen.`;
      if (v === a - T - E + 10 || v === a - T - E - 10) return "Fast! Schau nochmal genau auf die Zehner.";
      return `Mach die Probe: ${v} + ${b} sollte ${a} ergeben.`;
    },
    steps(t){
      const {a, b} = t, T = Math.floor(b/10)*10, E = b%10, m = a - T, res = a - b;
      const steps = [
        { text: T > 0 ? `Wir rechnen <b>${a} − ${b}</b>. Zuerst <b>zerlegen</b> wir die ${b}:<br><span class="b">${b} = ${T} + ${E}</span>`
                      : `Wir rechnen <b>${a} − ${b}</b>. Die ${b} hat keine Zehner, nur ${E} Einer.`,
          vis:() => base10(a/10, 0) },
      ];
      if (T > 0) steps.push(
        { text:`<b>Schritt 1: Erst die Zehner weg.</b><br>${a} − ${T} = <span class="mk">${m}</span>`,
          vis:() => base10(a/10, 0, {goneTens:T/10}) });
      steps.push(
        { text:`<b>Schritt 2: Dann die Einer weg.</b> Von ${m} sollen ${E} weg.<br>Einzelne Einer haben wir nicht. Also <b>tauschen</b> wir einen Zehner in 10 Einer.`,
          vis:() => base10(m/10 - 1, 10) },
        { text:`Jetzt nehmen wir ${E} Einer weg: ${m} − ${E} = <span class="mk">${res}</span>`,
          vis:() => base10(m/10 - 1, 10, {goneOnes:E}) },
        { text:`Kurz aufgeschrieben:<br>${a} − ${T} = ${m}<br>${m} − ${E} = ${res}<br><b>Probe:</b> ${res} + ${b} = <span class="g">${a} ✔</span>`,
          vis:() => null });
      return steps;
    },
    example: { kind:"minus", a:70, b:26, q:"70 − 26 = ?", slots:[{label:"Ergebnis", ans:44}] }
  },

  /* ===== Punkt vor Strich ===== */
  punkt: {
    sym: "·+", name: "Punkt vor Strich", desc: "Erst mal und geteilt, dann plus und minus. Schritt für Schritt.",
    make(){
      const type = pick(["pp+","pp-","n-q","n+p"]);
      let terms;
      if (type === "pp+" || type === "pp-"){
        let a=rnd(2,9), b=rnd(2,9), c=rnd(2,9), d=rnd(2,9);
        if (type === "pp-" && a*b <= c*d){ [a,b,c,d] = [c,d,a,b]; if (a*b === c*d) a++; }
        terms = [{g:[a,"·",b]}, {op: type==="pp+" ? "+":"−"}, {g:[c,"·",d]}];
      } else if (type === "n-q"){
        const d = rnd(2,9), q = rnd(2,9), n = rnd(q+1, q+40);
        terms = [{n}, {op:"−"}, {g:[q*d,":",d]}];
      } else {
        terms = [{n:rnd(3,40)}, {op:"+"}, {g:[rnd(2,9),"·",rnd(2,9)]}];
      }
      return punktTask(terms);
    },
    hint(t, vals){
      const last = vals[vals.length-1];
      if (last === t.naive && t.naive !== t.result) return "Achtung: <b>Punkt vor Strich!</b> Erst · und : rechnen, dann + und −.";
      const wrongPart = t.slots.slice(0,-1).findIndex((s,i) => vals[i] !== s.ans);
      if (wrongPart >= 0) return `Schau nochmal auf die Punktaufgabe <b>${t.slots[wrongPart].label.replace(" =","")}</b>.`;
      return null;
    },
    steps(t){
      const expr = (mark) => h("div",{class:"question", html: t.terms.map(x => x.op ? ` ${x.op} ` : x.n != null ? x.n :
        (mark ? `<span class="mk">${x.g.join(" ")}</span>` : x.g.join(" "))).join("")});
      const replaced = t.terms.map(x => x.op ? ` ${x.op} ` : x.n != null ? x.n : `<span class="b">${val(x.g)}</span>`).join("");
      const steps = [
        { text:`In der Aufgabe gibt es <b>Punktrechnungen</b> (· und :) und <b>Strichrechnungen</b> (+ und −).`,
          vis:() => expr(false) },
        { text:`Regel: <b>Punkt vor Strich.</b> Die Punktaufgaben markieren wir gelb und rechnen sie <b>zuerst</b>.`,
          vis:() => h("div",{class:"visual"}, expr(true), ruleBox("· und : zuerst, dann + und −")) },
      ];
      t.terms.filter(x => x.g).forEach(x => steps.push(
        { text:`${x.g.join(" ")} = <span class="mk">${val(x.g)}</span>`,
          vis: x.g[1] === "·" ? () => dotField(x.g[0], x.g[2]) : () => series(x.g[2], 10, {hit:val(x.g), over:val(x.g)+1}) }));
      steps.push(
        { text:`Jetzt setzen wir die Ergebnisse ein. Übrig bleibt eine leichte Strichaufgabe:`,
          vis:() => h("div",{class:"question", html: replaced}) },
        { text:`${replaced} = <span class="mk">${t.result}</span>`,
          vis:() => t.naive !== t.result ? ruleBox(`Wer einfach von links nach rechts rechnet, bekommt ${t.naive}. Das ist falsch!`) : null });
      return steps;
    },
    example: null // wird unten gesetzt
  },

  /* ===== Fachwörter ===== */
  begriffe: {
    sym: "Aa", name: "Fachwörter", desc: "Faktor, Produkt, Dividend, Divisor, Quotient. Was ist was?",
    make(){
      const a = rnd(2,9), b = rnd(2,9), p = a*b;
      const type = pick(["prod","faktor","quot","dividend","divisor","multi"]);
      switch (type){
        case "prod":     return bTask(`Das <b>Produkt</b> aus ${a} und ${b} ist …`, p, "mal", [a,b,p], 2);
        case "faktor":   return bTask(`Ein <b>Faktor</b> ist ${b}, das <b>Produkt</b> ist ${p}. Der andere <b>Faktor</b> ist …`, a, "mal", [a,b,p], 0);
        case "quot":     return bTask(`Der <b>Quotient</b> aus ${p} und ${b} ist …`, a, "durch", [p,b,a], 2);
        case "dividend": return bTask(`Der <b>Divisor</b> ist ${b}, der <b>Quotient</b> ist ${a}. Der <b>Dividend</b> ist …`, p, "durch", [p,b,a], 0);
        case "divisor":  return bTask(`Der <b>Dividend</b> ist ${p}, der <b>Quotient</b> ist ${a}. Der <b>Divisor</b> ist …`, b, "durch", [p,b,a], 1);
        default:         return bTask(`<b>Multipliziere</b> ${a} mit ${b}.`, p, "mal", [a,b,p], 2);
      }
    },
    hint(){ return null; },
    steps(t){
      const labels = t.op === "mal" ? ["Faktor","Faktor","Produkt"] : ["Dividend","Divisor","Quotient"];
      const sym = t.op === "mal" ? "·" : ":";
      const board = (show) => eqBoard([
        {v: t.unknown===0 && !show ? "?" : t.nums[0], l:labels[0], q:t.unknown===0},
        {op:sym},
        {v: t.unknown===1 && !show ? "?" : t.nums[1], l:labels[1], q:t.unknown===1},
        {op:"="},
        {v: t.unknown===2 && !show ? "?" : t.nums[2], l:labels[2], q:t.unknown===2}]);
      const how = t.op === "mal"
        ? (t.unknown === 2 ? `Das Produkt ist das Ergebnis vom Malnehmen: ${t.nums[0]} · ${t.nums[1]}`
                           : `Gesucht ist ein Faktor. Rückwärts rechnen mit Geteilt: ${t.nums[2]} : ${t.nums[1]}`)
        : (t.unknown === 2 ? `Der Quotient ist das Ergebnis vom Teilen: ${t.nums[0]} : ${t.nums[1]}`
          : t.unknown === 0 ? `Der Dividend ist die Zahl, die geteilt wird. Rückwärts mit Mal: ${t.nums[2]} · ${t.nums[1]}`
                            : `Der Divisor ist die Zahl, durch die geteilt wird. ${t.nums[0]} : ${t.nums[2]}`);
      return [
        { text: t.op === "mal" ? `Beim <b>Malnehmen</b> heißen die Zahlen so:` : `Beim <b>Teilen</b> heißen die Zahlen so:`,
          vis:() => h("div",{class:"visual"},
            eqBoard(t.op === "mal" ? [{v:"3",l:"Faktor"},{op:"·"},{v:"4",l:"Faktor"},{op:"="},{v:"12",l:"Produkt"}]
                                   : [{v:"12",l:"Dividend"},{op:":"},{v:"4",l:"Divisor"},{op:"="},{v:"3",l:"Quotient"}]),
            ruleBox(t.op === "mal" ? "Produkt = Ergebnis beim Malnehmen" : "Quotient = Ergebnis beim Teilen. Der Dividend wird geteilt."))
        },
        { text:`Wir tragen ein, was wir wissen. Das Gelbe suchen wir:`, vis:() => board(false) },
        { text:`${how} = <span class="mk">${t.slots[0].ans}</span>`, vis:() => board(true) },
      ];
    },
    example: null
  }
};

function val(g){ return g[1] === "·" ? g[0]*g[2] : g[0]/g[2]; }
function punktTask(terms){
  const parts = terms.filter(x => x.g);
  const slots = parts.map(x => ({label:`${x.g.join(" ")} =`, ans:val(x.g)}));
  // richtiges Ergebnis
  const vals = terms.map(x => x.op ? x.op : x.n != null ? x.n : val(x.g));
  const result = vals[1] === "+" ? vals[0] + vals[2] : vals[0] - vals[2];
  // falsch: stur von links nach rechts
  const flat = []; terms.forEach(x => { if (x.g) flat.push(...x.g); else flat.push(x.op || x.n); });
  let acc = flat[0];
  for (let i=1; i<flat.length; i+=2){
    const o = flat[i], n = flat[i+1];
    acc = o==="+" ? acc+n : o==="−" ? acc-n : o==="·" ? acc*n : acc/n;
  }
  slots.push({label:"Ergebnis", ans:result});
  const q = terms.map(x => x.op ? ` ${x.op} ` : x.n != null ? x.n : x.g.join(" ")).join("");
  return { kind:"punkt", terms, q, slots, result, naive: Number.isInteger(acc) ? acc : NaN };
}
STATIONS.punkt.example = punktTask([{g:[6,"·",5]},{op:"+"},{g:[8,"·",3]}]);

function bTask(text, ans, op, nums, unknown){
  return { kind:"begriffe", q:text, small:true, op, nums, unknown, slots:[{label:"Antwort", ans}] };
}
STATIONS.begriffe.example = bTask(`Ein <b>Faktor</b> ist 6, das <b>Produkt</b> ist 36. Der andere <b>Faktor</b> ist …`, 6, "mal", [6,6,36], 0);

/* Kekse austeilen (animiert) */
let dealTimer = null;
function dealVisual(n, d, _stage, instant=false){
  const wrap = h("div",{class:"visual"});
  const pile = h("div",{class:"pile"});
  for (let i=0;i<n;i++) pile.append(h("i",{class:"cookie"}));
  const plates = h("div",{class:"plates"});
  const ps = [];
  for (let i=0;i<d;i++){ const p = h("div",{class:"plate"}, h("span",{class:"n"},"0")); ps.push(p); plates.append(p); }
  const rest = h("div",{class:"restbox"}, h("b",{},"Rest:"));
  wrap.append(pile, plates, rest);
  const q = Math.floor(n/d), give = q*d;
  let i = 0;
  const step = () => {
    if (i < give){
      pile.lastChild && pile.lastChild.remove();
      const p = ps[i % d]; p.insertBefore(h("i",{class:"cookie"}), p.lastChild);
      p.lastChild.textContent = String(Math.floor(i/d)+1);
      i++;
      return true;
    }
    // übrig gebliebene Kekse in die Restbox
    while (pile.firstChild){ pile.firstChild.remove(); rest.append(h("i",{class:"cookie"})); }
    if (n % d === 0) rest.append(" keiner");
    return false;
  };
  clearInterval(dealTimer);
  if (instant || reduceMotion){ while (step()); }
  else dealTimer = setInterval(() => { if (!step()) clearInterval(dealTimer); }, Math.max(70, 900/d));
  return wrap;
}

/* ---------- Bildschirme ---------- */
const app = $("#app");
let state = null;

function home(){
  clearInterval(dealTimer);
  app.replaceChildren(
    h("p",{class:"intro"}, "Such dir eine Station aus. Bei jeder Aufgabe kannst du auf „Zeig mir den Weg“ tippen. Dann wird dir Schritt für Schritt mit Bildern erklärt, wie man rechnet."),
    h("div",{class:"stations"}, Object.entries(STATIONS).map(([id, s]) =>
      h("button",{class:"station", onclick:() => stationStart(id)},
        h("div",{class:"sym"}, s.sym), h("h3",{}, s.name), h("p",{}, s.desc))))
  );
}

function stationStart(id){
  const s = STATIONS[id];
  let sel = s.options ? [...s.options.def] : [];
  const kids = [
    h("button",{class:"back", onclick:home}, "← Alle Stationen"),
    h("h2",{}, s.name),
    h("p",{style:"margin:0;color:var(--ink-soft)"}, s.desc),
  ];
  if (s.options){
    const chips = h("div",{class:"row"});
    s.options.values.forEach(v => {
      const c = h("button",{class:"chip", "aria-pressed": String(sel.includes(v)), onclick:() => {
        sel = sel.includes(v) ? sel.filter(x => x!==v) : [...sel, v];
        c.setAttribute("aria-pressed", String(sel.includes(v)));
        go.disabled = sel.length === 0;
      }}, String(v));
      chips.append(c);
    });
    kids.push(h("div",{class:"stack", style:"gap:8px"}, h("div",{class:"label"}, s.options.label), chips));
  }
  const go = h("button",{class:"btn", onclick:() => startRound(id, sel)}, "Los geht's: 10 Aufgaben");
  kids.push(h("div",{class:"row"},
    h("button",{class:"btn warm", onclick:() => openSteps(s, s.example, null, true)}, "Erst erklären lassen"),
    go));
  app.replaceChildren(h("div",{class:"panel stack"}, kids));
}

function startRound(id, sel){
  state = { id, sel, i:0, results:[], redo:[] };
  nextTask();
}

function nextTask(){
  const s = STATIONS[state.id];
  if (state.i >= 10) return summary();
  state.task = s.make(state.sel);
  state.vals = state.task.slots.map(() => "");
  state.active = 0; state.tries = 0; state.helped = false; state.done = false;
  renderTask();
}

function renderTask(){
  const s = STATIONS[state.id], t = state.task;
  const dots = h("div",{class:"dots", "aria-label":`Aufgabe ${state.i+1} von 10`});
  for (let k=0;k<10;k++){
    const r = state.results[k];
    dots.append(h("i",{class: k===state.i ? "now" : r==="ok" ? "ok" : r==="help" ? "help" : ""}));
  }
  const slots = h("div",{class:"slots"});
  t.slots.forEach((sl, k) => {
    const b = h("button",{class:"slot" + (k===state.active && !state.done ? " active":""), "aria-label":sl.label,
      onclick:() => { state.active = k; renderTask(); }}, state.vals[k] || " ");
    if (state.marks) b.classList.add(state.marks[k] ? "right" : "wrong");
    slots.append(h("div",{class:"slotbox"}, b, h("small",{}, sl.label)));
  });
  const keys = h("div",{class:"keypad"});
  ["1","2","3","4","5","6","7","8","9","⌫","0", t.slots.length>1 ? "▸" : ""].forEach(k => {
    if (!k){ keys.append(h("span")); return; }
    keys.append(h("button",{"aria-label": k==="⌫" ? "Löschen" : k==="▸" ? "Nächstes Feld" : k, onclick:() => press(k), disabled: state.done}, k));
  });
  const fb = h("div",{class:"feedback " + (state.fbType||""), html: state.fb || "", "aria-live":"polite"});
  const actions = state.done
    ? h("div",{class:"actions"}, h("button",{class:"btn", onclick:() => { state.i++; state.fb=""; state.fbType=""; state.marks=null; nextTask(); }}, state.i===9 ? "Fertig!" : "Nächste Aufgabe →"))
    : h("div",{class:"actions"},
        h("button",{class:"btn", onclick:check}, "Prüfen"),
        h("button",{class:"btn alt", onclick:() => { state.helped = true; openSteps(s, t, renderTask); }}, "Zeig mir den Weg"));
  app.replaceChildren(
    h("div",{class:"playhead"}, h("button",{class:"back", onclick:() => stationStart(state.id)}, "← " + s.name), dots),
    h("div",{class:"task"},
      h("div",{class:"question" + (t.small ? " small":""), html:t.q}),
      slots, fb, keys, actions)
  );
}

function press(k){
  if (state.done) return;
  state.marks = null;
  if (k === "⌫") state.vals[state.active] = state.vals[state.active].slice(0,-1);
  else if (k === "▸") state.active = (state.active + 1) % state.task.slots.length;
  else if (state.vals[state.active].length < 3) state.vals[state.active] += k;
  renderTask();
}

function check(){
  const t = state.task, s = STATIONS[state.id];
  if (state.vals.some(v => v === "")){
    state.fb = "Füll erst alle Kästchen aus."; state.fbType = "bad";
    state.active = state.vals.findIndex(v => v === ""); return renderTask();
  }
  const nums = state.vals.map(Number);
  state.marks = t.slots.map((sl,k) => nums[k] === sl.ans);
  if (state.marks.every(Boolean)){
    state.done = true;
    const clean = state.tries === 0 && !state.helped;
    state.results[state.i] = clean ? "ok" : "help";
    if (!clean) state.redo.push(t.q.replace(/<[^>]+>/g,""));
    if (clean){ addStar(); state.fb = pick(["Super, richtig! ★","Klasse! ★","Genau so! ★","Stark gerechnet! ★"]); }
    else state.fb = "Richtig! Jetzt hast du's.";
    state.fbType = "good";
  } else {
    state.tries++;
    state.fb = s.hint(t, nums) || "Noch nicht ganz. Versuch es nochmal.";
    if (state.tries >= 2) state.fb += "<br>Tipp: Lass dir den Weg zeigen.";
    state.fbType = "bad";
    state.active = state.marks.findIndex(m => !m);
  }
  renderTask();
}

function summary(){
  const ok = state.results.filter(r => r==="ok").length;
  app.replaceChildren(h("div",{class:"panel stack summary"},
    h("div",{class:"label"}, STATIONS[state.id].name),
    h("div",{class:"big"}, `${ok} von 10`),
    h("p",{style:"margin:0"}, ok===10 ? "Alles auf Anhieb richtig. Wow!" : ok>=7 ? "Sehr gut! Du hast es fast drauf." : "Gut geübt! Nochmal eine Runde, dann sitzt es."),
    state.redo.length ? h("div",{class:"stack", style:"gap:8px"}, h("div",{class:"label"}, "Diese Aufgaben nochmal anschauen"), h("div",{class:"redo"}, state.redo.map(q => h("span",{}, q)))) : null,
    h("div",{class:"actions"},
      h("button",{class:"btn", onclick:() => startRound(state.id, state.sel)}, "Nochmal 10 Aufgaben"),
      h("button",{class:"btn alt", onclick:home}, "Andere Station"))
  ));
}

/* Schritt-für-Schritt-Erklärung */
function openSteps(station, task, onClose, demo=false){
  const steps = station.steps(task);
  let k = 0;
  const bg = h("div",{class:"sheet-bg", role:"dialog", "aria-modal":"true"});
  const close = () => { clearInterval(dealTimer); bg.remove(); document.removeEventListener("keydown", onKey); if (onClose) onClose(); };
  const sheet = h("div",{class:"sheet"});
  bg.append(sheet);
  bg.addEventListener("click", e => { if (e.target === bg) close(); });
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  function draw(){
    const st = steps[k];
    const vis = h("div",{class:"visual"});
    const v = st.vis && st.vis(k); if (v) vis.append(v);
    const last = k === steps.length-1;
    sheet.replaceChildren(
      h("div",{class:"row", style:"justify-content:space-between"},
        h("div",{class:"stepno"}, `${demo ? "Beispiel: " : ""}${task.q.replace(/<[^>]+>/g,"")}  ·  Schritt ${k+1} von ${steps.length}`),
        h("button",{class:"back", onclick:close, "aria-label":"Schließen"}, "✕")),
      h("div",{class:"text", html:st.text}),
      vis,
      h("div",{class:"actions"},
        k>0 ? h("button",{class:"btn alt", onclick:() => { k--; draw(); }}, "← Zurück") : null,
        last ? h("button",{class:"btn", onclick:close}, demo ? "Verstanden!" : "Jetzt rechne ich selbst")
             : h("button",{class:"btn", onclick:() => { k++; draw(); }}, "Weiter →"))
    );
    const btn = sheet.querySelector(".actions .btn:last-child"); if (btn) btn.focus();
  }
  document.body.append(bg);
  draw();
}

/* Tastatur */
document.addEventListener("keydown", e => {
  if (!state || !state.task || document.querySelector(".sheet-bg")) return;
  if (!app.querySelector(".task")) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("⌫");
  else if (e.key === "Tab" && state.task.slots.length > 1 && !state.done){ e.preventDefault(); press("▸"); }
  else if (e.key === "Enter"){ e.preventDefault(); state.done ? app.querySelector(".actions .btn").click() : check(); }
});

home();
</script>
</body>
</html>
