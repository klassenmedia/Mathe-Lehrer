<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"Andika";font-weight:400;src:url("andika-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Andika";font-weight:700;src:url("andika-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Grandstander";font-weight:800;src:url("grandstander-latin-800-normal.woff2") format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f6f8fc}
#root{
  --paper:#f6f8fc; --grid:#dfe7f3; --ink:#1c2f5e; --soft:#56658a; --card:#ffffff; --line:#c8d3e6;
  --blue:#2f6fde; --blue-bg:#e4edfd; --orange:#d96a12; --orange-bg:#fdeedd;
  --marker:#ffe36e; --good:#1f8a4f; --good-bg:#e1f4e8; --bad:#cf3434; --bad-bg:#fde6e6;
  position:relative; width:100%; height:100%; overflow:hidden; background:var(--paper);
  color:var(--ink); font-family:"Andika",sans-serif;
}
#bg{position:absolute; inset:0;
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:48px 48px}
#margin{position:absolute; top:0; bottom:0; left:96px; width:3px; background:#f2b8b8}
#brand{position:absolute; left:140px; top:34px; font:800 44px "Grandstander",sans-serif; display:flex; gap:0}
#brand span{background:linear-gradient(transparent 58%,var(--marker) 58%)}
#topic{position:absolute; right:70px; top:38px; font:700 30px "Andika",sans-serif; background:var(--card);
  border:3px solid var(--line); border-radius:999px; padding:6px 26px}

.scene{position:absolute; inset:0}
.inner{position:absolute; left:140px; right:80px; top:130px; height:760px; display:flex; align-items:center; justify-content:center; gap:90px}
.col{display:flex; flex-direction:column; align-items:center; gap:28px}
.colL{display:flex; flex-direction:column; align-items:flex-start; gap:26px}

.cap{position:absolute; left:0; right:0; bottom:36px; height:150px; display:flex; align-items:center; justify-content:center}
.captext{max-width:1640px; background:var(--card); border:3px solid var(--line); border-radius:28px; padding:16px 44px;
  font:700 46px/1.25 "Andika",sans-serif; text-align:center; color:var(--ink)}

/* Typo */
.h{font:800 84px/1.1 "Grandstander",sans-serif; text-align:center}
.eq{font:800 104px/1.15 "Grandstander",sans-serif; display:flex; gap:28px; align-items:center; white-space:nowrap}
.eq.m{font-size:76px; gap:20px}
.eq.s{font-size:60px; gap:16px}
.tok{display:inline-block; position:relative; isolation:isolate}
.b{color:var(--blue)} .o{color:var(--orange)} .g{color:var(--good)} .r{color:var(--bad)}
.mk{position:absolute; left:-10px; right:-10px; top:18%; bottom:8%; background:var(--marker); border-radius:10px; z-index:-1; transform-origin:left center}
.strike{position:absolute; left:-12px; right:-12px; top:50%; height:10px; margin-top:-5px; background:var(--bad); border-radius:5px; transform-origin:left center}
.box{display:inline-block; width:1.05em; height:1.05em; border:8px solid var(--ink); border-radius:12px; vertical-align:middle}

/* Karten */
.card{background:var(--card); border:4px solid var(--line); border-radius:28px; padding:28px 40px; display:flex; flex-direction:column; align-items:center; gap:10px}
.card .eq{font-size:70px}
.card .sub{font:700 34px "Andika",sans-serif; color:var(--soft)}
.rule{background:var(--card); border:4px solid var(--line); border-left:22px solid var(--marker); border-radius:20px; padding:30px 44px;
  font:700 50px/1.3 "Andika",sans-serif; max-width:1350px}
.rule .k{font:800 40px "Grandstander",sans-serif; color:var(--orange); display:block; margin-bottom:8px}
.check{width:150px; height:150px; border-radius:50%; background:var(--good); color:#fff; font:800 100px/150px "Grandstander",sans-serif; text-align:center}

/* Titel */
.title{display:flex; flex-direction:column; align-items:center; gap:24px}
.title .sym{width:220px; height:220px; border-radius:48px; background:var(--blue-bg); color:var(--blue); font:800 150px/220px "Grandstander",sans-serif; text-align:center}
.title h1{font:800 120px/1.05 "Grandstander",sans-serif; text-align:center}
.title p{font:700 52px "Andika",sans-serif; color:var(--soft)}

/* Punktefeld */
.field{display:flex; flex-direction:column; gap:12px; position:relative}
.frow{display:flex; gap:12px; position:relative; align-items:center}
.frow.g5{margin-top:14px}
.dot{width:var(--s,40px); height:var(--s,40px); border-radius:50%; background:var(--blue); flex:none}
.dot.o{background:var(--orange)}
.dot.c5{margin-left:16px}
.flab{font:800 40px "Grandstander",sans-serif; color:var(--soft); margin-left:22px; width:110px}
.fstrike{position:absolute; left:-16px; right:-16px; top:50%; height:8px; margin-top:-4px; background:var(--bad); border-radius:4px; transform-origin:left center}

/* Kekse */
.cstage{position:relative; width:1700px; height:740px; flex:none}
.cookie{position:absolute; width:56px; height:56px; border-radius:50%; background:var(--orange);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.plate{position:absolute; width:240px; height:240px; border-radius:50%; background:var(--card); border:6px solid var(--line)}
.restbox{position:absolute; width:250px; height:200px; border:6px dashed var(--bad); border-radius:26px}
.restlab{position:absolute; font:800 40px "Grandstander",sans-serif; color:var(--bad); width:250px; text-align:center}
.plab{position:absolute; width:240px; text-align:center; font:800 44px "Grandstander",sans-serif; color:var(--soft)}
.ceq{position:absolute; left:0; right:0; top:610px; display:flex; justify-content:center}

/* Reihe */
.series{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:1600px}
.chip{display:block; position:relative; font:800 42px "Grandstander",sans-serif; background:var(--card); border:4px solid var(--line); border-radius:22px; padding:8px 24px}
.chip.hit{background:var(--good-bg); border-color:var(--good); color:var(--good)}
.chip.over{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}

/* Zehner/Einer */
.b10{display:flex; gap:18px; align-items:flex-end; height:360px}
.bar{width:48px; height:340px; border-radius:6px; background:var(--blue); flex:none;
  background-image:linear-gradient(rgba(255,255,255,.55) 3px,transparent 3px); background-size:100% 34px}
.cubes{display:grid; grid-template-columns:repeat(2,48px); gap:8px; margin-left:20px}
.cube{width:48px; height:48px; border-radius:6px; background:var(--orange)}
.split{display:flex; flex-direction:column; align-items:center; gap:20px}
.split .parts{display:flex; gap:160px}
.pbox{font:800 96px "Grandstander",sans-serif; background:var(--card); border:5px solid var(--line); border-radius:26px; padding:6px 40px}
.pbox.bl{border-color:var(--blue); color:var(--blue)} .pbox.or{border-color:var(--orange); color:var(--orange)}
.arrows{font:800 80px "Grandstander",sans-serif; color:var(--soft); display:flex; gap:200px}

/* Begriffe */
.lab{display:block; font:700 38px "Andika",sans-serif; color:var(--orange); text-align:center; margin-top:6px}
.cell{display:flex; flex-direction:column; align-items:center}
.pv{display:flex; gap:90px}
.pv .card{min-width:520px}
.big{font:800 170px/1 "Grandstander",sans-serif}

/* Stellentafel */
.hplate{width:100px; height:100px; border-radius:6px; background:var(--blue); flex:none;
  background-image:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px); background-size:10px 10px}
.hplate.big{width:220px; height:220px; background-size:22px 22px}
.sbar{width:24px; height:100px; border-radius:4px; background:var(--blue); flex:none;
  background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px); background-size:100% 10px}
.sbar.big{width:44px; height:220px; background-size:100% 22px}
.scube{width:24px; height:24px; border-radius:4px; background:var(--orange); flex:none}
.scube.big{width:44px; height:44px}
.tafel{display:grid; grid-template-columns:repeat(3,400px); background:var(--card); border:4px solid var(--line); border-radius:24px; overflow:hidden}
.tafel .th{font:800 52px "Grandstander",sans-serif; text-align:center; padding:8px; border-bottom:4px solid var(--line)}
.tafel .tc{height:250px; display:flex; flex-wrap:wrap; gap:10px; align-content:center; justify-content:center; padding:14px}
.tafel .td{position:relative; height:140px; font:800 110px/140px "Grandstander",sans-serif; text-align:center; border-top:4px solid var(--line)}
.tafel .td span{position:absolute; inset:0; display:block}
.tafel > div:nth-child(3n+1), .tafel > div:nth-child(3n+2){border-right:4px solid var(--line)}
.trow{display:flex; align-items:center; gap:34px}
.trow .eqs{font:800 70px "Grandstander",sans-serif}
.trow .lab2{font:700 40px "Andika",sans-serif; color:var(--soft); width:420px}
/* Sprünge */
.jumps{display:flex; align-items:center; gap:18px}
.jump{display:flex; flex-direction:column; align-items:center; font:800 44px "Grandstander",sans-serif}
.jump .ar{font-size:70px; line-height:1; color:var(--soft)}
.jchip{font:800 70px "Grandstander",sans-serif; background:var(--card); border:4px solid var(--line); border-radius:24px; padding:6px 30px}
/* Malkreuz */
.kreuz{display:grid; grid-template-columns:repeat(3,230px); font:800 76px/120px "Grandstander",sans-serif; text-align:center}
.kreuz > div{border:4px solid var(--line); background:var(--card); margin:-2px}
.kreuz .hd{background:var(--blue-bg)}
/* Fläche halbieren */
.area{position:relative; width:1540px; height:200px}
.half{position:absolute; left:0; width:770px; height:80px; background-size:22px 40px;
  background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px)}
.half.h1{top:20px; background-color:var(--blue)} .half.h2{top:100px; background-color:var(--orange)}
/* Zahlenhaus */
.house{display:flex; flex-direction:column; align-items:center}
.roof{width:620px; height:170px; background:var(--orange); clip-path:polygon(50% 0,100% 100%,0 100%); display:flex; align-items:flex-end; justify-content:center; padding-bottom:12px;
  font:800 84px "Grandstander",sans-serif; color:#fff}
.floor{display:flex; width:520px}
.floor div{flex:1; text-align:center; font:800 84px/130px "Grandstander",sans-serif; background:var(--card); border:5px solid var(--line)}
.rooms{display:grid; grid-template-columns:1fr 1fr; width:520px}
.rooms div{text-align:center; font:800 50px/96px "Grandstander",sans-serif; background:var(--card); border:5px solid var(--line); margin-top:-5px}
/* Muster */
.muster{display:flex; flex-direction:column; gap:8px; font:800 70px/1.1 "Grandstander",sans-serif}
.muster div{display:flex; gap:24px}

/* ===== 3D-Optik ===== */
#root{--blue-hi:#8fb5ff; --blue-lo:#1d4cb3; --orange-hi:#ffb877; --orange-lo:#9a4708; --line-lo:#aebbd3}
.inner{perspective:1800px}
.h, .eq, .title h1, .big, .pbox, .jchip, .kreuz, .roof{text-shadow:0 6px 0 rgba(28,47,94,.13)}
.card, .rule, .captext, .chip, .pbox, .jchip, .tafel, .plate, .floor div, .rooms div{box-shadow:0 10px 0 var(--line-lo), 0 22px 30px rgba(28,47,94,.12)}
.title .sym{box-shadow:0 14px 0 #b7cbef, 0 30px 40px rgba(28,47,94,.18)}
.dot{background:radial-gradient(circle at 34% 30%, var(--blue-hi) 0 12%, var(--blue) 45%, var(--blue-lo) 100%); box-shadow:0 5px 8px rgba(28,47,94,.25)}
.dot.o, .cookie{background:radial-gradient(circle at 34% 30%, var(--orange-hi) 0 12%, var(--orange) 45%, var(--orange-lo) 100%)}
.cookie{box-shadow:0 6px 10px rgba(28,47,94,.25)}
.bar, .sbar, .hplate{box-shadow:8px 8px 0 var(--blue-lo)}
.cube, .scube{box-shadow:6px 6px 0 var(--orange-lo)}
/* echte 3D-Klötze: Vorderseite + Deckel (::before) + Seite (::after) */
.k3{position:absolute; width:36px; height:36px; background:var(--orange); border-radius:2px}
.k3::before{content:""; position:absolute; left:0; bottom:100%; width:100%; height:14px; background:var(--orange-hi); transform:skewX(-45deg); transform-origin:left bottom}
.k3::after{content:""; position:absolute; left:100%; top:0; width:14px; height:100%; background:var(--orange-lo); transform:skewY(-45deg); transform-origin:left top}
.k3.st{height:360px; background:var(--blue); background-image:linear-gradient(rgba(255,255,255,.45) 2px,transparent 2px); background-size:100% 36px}
.k3.st::before{background:var(--blue-hi)} .k3.st::after{background:var(--blue-lo)}
.bstage{position:relative; width:1150px; height:530px; flex:none; background:var(--card); border:4px solid var(--line); border-radius:28px;
  box-shadow:0 12px 0 var(--line-lo), 0 26px 40px rgba(28,47,94,.12)}
.bstage .div{position:absolute; top:0; bottom:0; left:600px; width:4px; background:var(--line)}
.bstage .blab{position:absolute; top:16px; text-align:center; font:800 44px "Grandstander",sans-serif}
/* schriftliches Rechnen (untereinander) */
.wr{display:grid; font:800 92px/1 "Grandstander",sans-serif; text-align:center; align-items:end}
.wr > div{width:96px; height:110px; display:flex; align-items:center; justify-content:center; position:relative}
.wr .hd{height:64px; font-size:44px}
.wr .cr{height:58px; font-size:46px; color:var(--bad)}
.wr .ln{height:0; border-top:8px solid var(--ink); width:100%}
.wr .sm{position:absolute; top:-44px; left:0; right:0; font-size:44px; color:var(--bad)}
.wr .x{position:absolute; left:14px; right:14px; top:50%; height:8px; margin-top:-4px; background:var(--bad); border-radius:4px; transform-origin:left center}
.wr .hl{position:absolute; inset:0 6px; border-radius:16px; background:var(--marker); z-index:-1}
.wr > div{isolation:isolate}
.wr > div > span{display:block}
.hz-row{display:flex; gap:24px; font:800 96px "Grandstander",sans-serif}

/* Brücken-Trick und leerer Zahlenstrahl */
.zrow{position:relative; padding-top:260px; display:flex; flex:none}
.zrow svg{position:absolute; left:0; top:0; overflow:visible}
.zc{position:relative; height:130px; font:800 110px/130px "Grandstander",sans-serif; text-align:center; flex:none}
.zc.box{border:6px solid var(--ink); border-radius:18px; height:124px; margin:3px 10px 0; background:var(--card); box-shadow:0 8px 0 var(--line-lo)}
.zc.box span{display:block; color:var(--good)}
.zc .sub{position:absolute; top:100%; left:0; right:0; font:800 56px/1.1 "Grandstander",sans-serif; color:var(--bad)}
.zc .x{position:absolute; left:16px; right:16px; top:50%; height:9px; margin-top:-4px; background:var(--bad); border-radius:4px; transform-origin:left center}
.cy{position:absolute; width:60px; margin-left:-30px; text-align:center; font:800 60px/1 "Grandstander",sans-serif; color:var(--bad)}
.zs text{font-family:"Grandstander",sans-serif; font-weight:800}
.zs .num{font-size:52px; fill:var(--ink)} .zs .jl{font-size:50px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="%%TOTAL%%" data-width="1920" data-height="1080">
  <div id="bg"></div>
  <div id="margin"></div>
  <div id="brand">Zahlen<span>werkstatt</span></div>
  <div id="topic">%%TOPIC%%</div>
  <audio id="voice" src="voice.wav" data-start="0" data-duration="%%TOTAL%%"></audio>
%%SCENES%%
%%CAPTIONS%%
</div>
<script>
const tl = gsap.timeline({ paused: true });
const E = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function sceneFade(S, T0, T1){
  const inner = S.querySelector(".inner");
  tl.fromTo(inner, {opacity:0, rotationX:14, y:70, scale:.9, transformPerspective:1800, transformOrigin:"50% 100%"},
                   {opacity:1, rotationX:0, y:0, scale:1, duration:.6, ease:"power3.out"}, T0);
  tl.to(inner, {opacity:0, rotationY:-18, x:-160, scale:.94, duration:.35, ease:"power2.in"}, T1 - .35);
}
function pop(els, at, stagger=0){ tl.fromTo(els, {scale:0, opacity:0, rotationY:-110, transformPerspective:900}, {scale:1, opacity:1, rotationY:0, duration:.6, ease:"back.out(1.8)", stagger}, at); }
function rise(els, at, stagger=0){ tl.fromTo(els, {opacity:0, y:50, rotationX:-75, transformPerspective:900, transformOrigin:"50% 100%"}, {opacity:1, y:0, rotationX:0, duration:.6, ease:"back.out(1.4)", stagger}, at); }
function drop(els, at, stagger=0){ tl.fromTo(els, {opacity:0, y:-260}, {opacity:1, y:0, duration:.7, ease:"bounce.out", stagger}, at); }
function draw(els, at){ tl.fromTo(els, {scaleX:0}, {scaleX:1, duration:.45, ease:"power2.out"}, at); }
function fadeTo(els, at, o=.25){ tl.to(els, {opacity:o, duration:.4}, at); }
function blip(el, at){ tl.fromTo(el, {scale:1}, {scale:1.18, duration:.25, yoyo:true, repeat:1, ease:"power1.inOut"}, at); }
// 3D-Klotz an Position (x,y = linke obere Ecke der Vorderseite)
function klotz(host, kind, x, y){ const e = E("div", "k3" + (kind ? " " + kind : "")); e.style.left = x + "px"; e.style.top = y + "px"; host.append(e); return e; }
function moveTo(el, from, to, at, dur=.7, ease="power2.inOut"){ tl.to(el, {x: to[0] - from[0], y: to[1] - from[1], duration: dur, ease}, at); }
// Schriftliches Rechnen: cols = Stellen (z.B. ["H","Z","E"]), a/b = Ziffernfolgen, op = "+"/"−"
function written(host, cols, a, b, op){
  const n = cols.length, g = host; g.classList.add("wr"); g.style.gridTemplateColumns = `repeat(${n + 1}, 96px)`;
  const cell = (cls, txt) => { const d = E("div", cls || "", txt); g.append(d); return d; };
  const pad = (s) => s.padStart(n, " ").split("");
  const R = {hd:[], cr:[], a:[], b:[], res:[]};
  cell("hd", "");                    cols.forEach((c, i) => R.hd.push(cell("hd " + (c === "E" ? "o" : "b"), c)));
  cell("cr", "");                    cols.forEach(() => R.cr.push(cell("cr", "")));
  cell("", "");                      pad(a).forEach(ch => R.a.push(cell("", ch.trim())));
  cell("", op);                      pad(b).forEach(ch => R.b.push(cell("", ch.trim())));
  for (let i = 0; i <= n; i++) cell("ln", "");
  cell("", "");                      cols.forEach(() => R.res.push(cell("", "")));
  return R;
}
function put(cellEl, txt, cls){ const s = E("span", cls || "", txt); cellEl.append(s); return s; }
function markAt(cellEl, at, hold=3){ const m = E("span", "hl"); cellEl.prepend(m); tl.fromTo(m, {opacity:0}, {opacity:1, duration:.3}, at); tl.to(m, {opacity:0, duration:.4}, at + hold); return m; }
function plus_step(R, i, at, digit, carryTo, carryAt){ markAt(R.res[i], at, carryAt ? carryAt - at + 1 : 3); pop(put(R.res[i], digit, "g"), at + 1.6); if (carryTo != null) pop(put(R.cr[carryTo], "1"), carryAt); }
function strikeCell(cellEl, at){ const x = E("span", "x"); cellEl.append(x); tl.fromTo(x, {scaleX:0, rotation:-20}, {scaleX:1, rotation:-20, duration:.4, ease:"power2.out"}, at); return x; }
// ---- Brücken-Trick: Aufgabe als Zeile fester Zellen (cw px breit)
const SVGNS = "http://www.w3.org/2000/svg";
function zeile(host, chars, cw){
  host.classList.add("zrow");
  const svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("width", chars.length * cw); svg.setAttribute("height", 260); host.append(svg);
  const cells = chars.map(c => { const d = E("div", "zc" + (c === "#" ? " box" : ""), c === "#" ? "" : c); d.style.width = (c === "#" ? cw - 20 : cw) + "px"; host.append(d); return d; });
  return {svg, cells, cx: i => i * cw + cw / 2};
}
function bogen(svg, x1, x2, h, color, at, yBase=250){
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", `M ${x1} ${yBase} Q ${(x1 + x2) / 2} ${yBase - 2 * h} ${x2} ${yBase}`);
  p.setAttribute("fill", "none"); p.setAttribute("stroke", color); p.setAttribute("stroke-width", "9"); p.setAttribute("stroke-linecap", "round");
  svg.append(p);
  const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", L);
  tl.fromTo(p, {attr:{"stroke-dashoffset": L}}, {attr:{"stroke-dashoffset": 0}, duration:.9, ease:"power2.inOut"}, at);
  return {p, apex:[(x1 + x2) / 2, yBase - h]};
}
function aufBogen(host, b, txt, at){ const d = E("div", "cy", txt); d.style.left = b.apex[0] + "px"; d.style.top = (b.apex[1] - 70) + "px"; host.append(d); pop(d, at); return d; }
function inBox(cell, txt, at){ const s = E("span", "", txt); cell.append(s); pop(s, at); return s; }
function unterZelle(cell, txt, at){ const s = E("div", "sub", txt); cell.append(s); pop(s, at); return s; }
function streiche(cell, at){ const x = E("span", "x"); cell.append(x); tl.fromTo(x, {scaleX:0, rotation:-20}, {scaleX:1, rotation:-20, duration:.4}, at); }
// ---- leerer Zahlenstrahl mit Sprüngen. pts: [[wert, x], ...]
function strahl(host, W, pts){
  const svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("width", W); svg.setAttribute("height", 420); svg.classList.add("zs"); host.append(svg);
  const line = document.createElementNS(SVGNS, "line");
  Object.entries({x1:20, x2:W - 20, y1:300, y2:300, stroke:"#1c2f5e", "stroke-width":8, "stroke-linecap":"round"}).forEach(([k, v]) => line.setAttribute(k, v));
  svg.append(line);
  const mk = pts.map(([v, x]) => {
    const g = document.createElementNS(SVGNS, "g");
    const tk = document.createElementNS(SVGNS, "line");
    Object.entries({x1:x, x2:x, y1:280, y2:320, stroke:"#1c2f5e", "stroke-width":7}).forEach(([k, val]) => tk.setAttribute(k, val));
    const tx = document.createElementNS(SVGNS, "text"); tx.setAttribute("x", x); tx.setAttribute("y", 385); tx.setAttribute("text-anchor", "middle"); tx.setAttribute("class", "num"); tx.textContent = v;
    g.append(tk, tx); svg.append(g); return {g, x};
  });
  return {svg, mk};
}
function sprung(Z, i, j, label, color, at, h=150){
  const x1 = Z.mk[i].x, x2 = Z.mk[j].x;
  const b = bogen(Z.svg, x1, x2, h, color, at, 290);
  const tx = document.createElementNS(SVGNS, "text"); tx.setAttribute("x", (x1 + x2) / 2); tx.setAttribute("y", 290 - h - 22);
  tx.setAttribute("text-anchor", "middle"); tx.setAttribute("class", "jl"); tx.setAttribute("fill", color); tx.textContent = label; Z.svg.append(tx);
  tl.fromTo(tx, {opacity:0}, {opacity:1, duration:.3}, at + .5);
  tl.fromTo(Z.mk[j].g, {opacity:0}, {opacity:1, duration:.3}, at + .8);
}
// Punktefeld: liefert Reihen [{row, dots, lab}]
function field(host, rows, cols, size, color, labels){
  host.classList.add("field"); host.style.setProperty("--s", size + "px");
  const R = [];
  for (let r = 0; r < rows; r++){
    const row = E("div", "frow" + (r === 5 ? " g5" : ""));
    const dots = [];
    for (let c = 0; c < cols; c++){
      const d = E("div", "dot " + (color ? color(r, c) : "") + (c === 5 ? " c5" : ""));
      row.append(d); dots.push(d);
    }
    let lab = null;
    if (labels){ lab = E("div", "flab", labels(r)); row.append(lab); }
    host.append(row); R.push({row, dots, lab});
  }
  return R;
}
// Kekse: n Kekse, d Teller. init(i, api) -> [x,y] Startposition (Mittelpunkt)
function cookies(host, n, d, init){
  const P = i => [200 + i * 300, 380];
  const restC = [1470, 380];
  const api = {
    pile: i => { const cols = Math.min(n, 7); const x0 = 850 - (cols - 1) * 40; return [x0 + (i % cols) * 80, 50 + Math.floor(i / cols) * 80]; },
    plate: (p, k) => { const o = [[-40,-40],[40,-40],[-40,40],[40,40]][k]; const c = P(p); return [c[0] + o[0], c[1] + o[1]]; },
    rest: k => [restC[0] - 75 + (k % 3) * 75, restC[1] - 40 + Math.floor(k / 3) * 80],
  };
  const plates = [], ck = [], pos = [];
  for (let p = 0; p < d; p++){
    const e = E("div", "plate"); const c = P(p);
    e.style.left = (c[0] - 120) + "px"; e.style.top = (c[1] - 120) + "px"; host.append(e); plates.push(e);
  }
  const rb = E("div", "restbox"); rb.style.left = (restC[0] - 125) + "px"; rb.style.top = (restC[1] - 100) + "px"; host.append(rb);
  const rl = E("div", "restlab", "Rest"); rl.style.left = (restC[0] - 125) + "px"; rl.style.top = (restC[1] - 160) + "px"; host.append(rl);
  for (let i = 0; i < n; i++){
    const p = init(i, api); pos.push(p);
    const c = E("div", "cookie"); c.style.left = (p[0] - 28) + "px"; c.style.top = (p[1] - 28) + "px"; host.append(c); ck.push(c);
  }
  api.plates = plates; api.ck = ck; api.restbox = [rb, rl];
  api.move = (i, to, at, dur=.55) => tl.to(ck[i], {x: to[0] - pos[i][0], y: to[1] - pos[i][1], duration: dur, ease: "power2.inOut"}, at);
  api.plabel = (p, txt) => { const e = E("div", "plab", txt); const c = P(p); e.style.left = (c[0] - 120) + "px"; e.style.top = (c[1] + 130) + "px"; host.append(e); return e; };
  return api;
}
